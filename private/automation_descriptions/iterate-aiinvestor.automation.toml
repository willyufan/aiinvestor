prompt = "反馈语言硬约束：本任务的过程反馈、错误/blocker 说明、最终结果总结、提交/push 状态与下一步提示都必须使用中文；命令、文件路径、strategy/base id、JSON key、英文接口名可以保留英文原文。不要输出英文段落式总结。\n\n持续迭代 aiinvestor 的策略研究与结果产物。北极星：每轮都要让 A股与沪港通研究线产生新的、可比较的、能推进下一轮判断的策略信息，而不是只复跑老策略或同步产物。\n\n工作树安全：允许 main 有未提交改动；开始先看 git status/diff，识别并保留已有用户改动。不要因为 dirty main 停止任务；不要执行 git reset、git checkout、git clean 或任何会丢弃用户改动的操作；不要创建或切换独立 worktree。提交前只 stage 本轮自动任务产生或同步修正的目标文件，不带入无关用户改动。results/research/a_share/research_iteration_*.json、research_experiments.jsonl 这类 guard 自动产物可由本轮 guard 正常更新；若其它同一处内容发生实质冲突且无法判断，才停止说明。\n\n每轮固定流程：\n1. 运行 .venv/bin/python scripts/research_iteration_guard.py，读取 research_iteration_report/state/experiments。\n2. 若 coverage_gate.status 为 block，优先执行 report.blocking scopes 给出的增量 rerun_commands，然后重跑 guard；不要把 --only-base-ids/--only-strategy-ids 补缺口命令替换成全量回测。若 block scope 包含 ashare_path4_emergent_theme，下一轮必须优先补跑这些 Path 4 强主题涌现候选，不能只记录计划。\n3. 读取并更新 docs/path1_plan.md、docs/path2_plan.md、docs/path3_plan.md、docs/path4_emergent_theme_plan.md、docs/path5_event_knowledge_graph_plan.md、docs/path1_plan_hkconnect.md、docs/path2_plan_hkconnect.md、docs/path3_plan_hkconnect.md、docs/hkconnect_strategy_expansion_plan.md。plan 更新必须至少包含：上一轮候选/结果摘要、本轮候选 ID 与命令、下一轮 focus 提示；若 report.recommended_focus 无法映射到候选，先在对应 plan 中补 focus -> next candidates 池。\n4. 根据 report.quotas、report.rotation、recommended_focus、候选池 cap 与最近失败记录，设计并推进有预算约束的新增候选或新参数变体。\n5. 做必要的 winner/robust/tracked/live/public 同步，最后再次运行 research_iteration_guard.py，同步覆盖率、实验记录与停滞轮换状态。\n\n实验预算与判定：在 blocking coverage 补齐后，按 report.quotas 分配本轮新增实验；典型每轮可执行新增/新参数确认候选总量不超过 10 个 strategy/base ids，除非明显仍在 6 小时预算内。所有路径都必须至少完成巡检、候选设计和下一轮命令记录；可执行回测优先投给 rotation/recommended_focus、停滞最久、或最可能改善 winner/robust 的路径。新增实验必须留下候选 id、相对现有 winner/robust candidate 的改动点、验证窗口、结果优劣、失败原因或晋级理由。coverage 补缺口、确认已有 winner_only_pass 候选、确认已有 candidate-pass 宇宙、tracked_active 同步、图表/public/live 导出都不算新增策略实验。\n\n多路径纪律：每轮必须巡检 A股 Path 1、A股 Path 2、A股 Path 3、A股 Path 4 强主题涌现、A股 Path 5 事件知识图谱入口，以及沪港通 Path 1/2/3 与 HK Path 4-7 扩展 smoke。A股 Path 4-lite/core_multifactor 仍是 Path 1 内的强制 direction group，不等同于独立 Path 4；独立 Path 4 只指 emergent_theme_discovery/ashare_path4_emergent_theme 这条无人工主题标签的强主题涌现路径。winner_only_pass.py 只允许作为 A股 Path 1 fast-pass，禁止当作 Path 2/3/4 入口；path2_candidate_pass、图表生成和 comparison rebuild 不是回测。即使某一路径发现 clear improvement，也不能取消其它路径的巡检和候选设计；若预算不足以全部回测，必须记录未跑候选和下一轮第一条命令。\n\n候选池控制：每个 A股 path 的 active 候选池默认不超过 60 个；HK 各 path 使用对应 plan 文档里的 HK explore cap。达到 cap 后，新增候选前必须按 robust 指标、窗口覆盖和最近失败记录淘汰或归档最弱候选，并在 plan 中记录 evict 原因，避免候选池只增不减。\n\nA股回测保持增量：补缺口或确认新增候选使用 .venv/bin/python backtest_marketcap_etf.py --sample-tags <WINDOWS> --only-base-ids <IDS>。常规 6 小时迭代不要跑 research_active、archive 或 all；只有明确低频全量校验才允许。同步当前活跃观察集合用 .venv/bin/python backtest_marketcap_etf.py --family-scope refresh_active --sample-tags since_2017_01,since_2020_01,since_2023_01,since_2025_01,since_2026_01。\n\nA股 Path 1：渐进优化路径，限制在 docs/path1_plan.md 的固定方向内；可用 scripts/winner_only_pass.py 快筛，围绕 promotion_ramp、satellite_defense、holding_shape、weekly_exposure_path、core_multifactor 等方向维持约 24-28 个 fast-pass base candidates，并优先比较 weekly_exposure_path 中 __port_weekly_exposure_buffered 与 __port_weekly_exposure_asym。只有候选明确改善 Path 1 窗口赢家时才补必要确认回测。\n\nA股 Path 1/core_multifactor：每轮读取 backtest_marketcap_etf.py 中 PATH1_FAST_PASS_DIRECTION_GROUPS[\"core_multifactor\"] 与 PATH1_FAST_PASS_VARIANT_IDS，覆盖目标以代码实际返回的 core_multifactor strategy_base_id 为准；不要凭文字假定 9×overlay 全量，若新增 overlay 变体必须在 plan 中单独列出并计入 Path 1 预算。缺口只用 --only-base-ids 补，不因首个窗口弱就跳过其它窗口。若 report.rotation/recommended_focus、多因子结果变化或 Path 1 停滞指向多因子，要设计并尝试新的多因子组合、overlay 或确认形态。\n\nA股 Path 2：无约束上限探索，独立于 Path 1。读取 docs/path2_plan.md，运行 scripts/path2_candidate_pass.py，沿独立候选族推进；优先增加适配 since_2020_01 的中周期高收益原型，保持候选族不过度被单一 high_growth family 压扁；维护四窗口 winner 与 robust candidate，必要时运行 scripts/update_weighted_winners.py。\n\nA股 Path 3：纯周度高频调仓，独立于 Path 1/2。读取 docs/path3_plan.md；Path 3 策略 id 必须以 _weekly 结尾；月度选股 + 周度仓位 overlay（如 __port_weekly_exposure*）不属于 Path 3，即使名字含 weekly。重点比较 since_2020_01 与 since_2023_01 的可持续改善，同时记录高换手和高回撤代价。\n\nA股 Path 4 强主题涌现：独立于 Path 1/2/3，用来捕捉从市场结构中自动涌现的强主题，不做半导体、存储、AI、机器人等人工/后视主题归类，ETF 先不纳入。每轮读取 docs/path4_emergent_theme_plan.md 与 backtest_marketcap_etf.py 中 PATH4_THEME_DISCOVERY_BASE_IDS / PATH4_THEME_DISCOVERY_VARIANT_IDS；当前第一批为 3 个底座 × 4 个 emergent_theme 变体，共 12 个候选。若 research_iteration_guard.py 报告 ashare_path4_emergent_theme 缺口，下一轮第一优先级是按 rerun_commands 补齐 since_2017_01、since_2020_01、since_2023_01、since_2025_01、since_2026_01 五窗口。补齐后运行 scripts/path2_candidate_pass.py，检查 emergent_theme_discovery family 的窗口排名、robust 表现、持仓明细是否能捕捉强行业/强龙头；再围绕 theme_signal_quality、theme_risk_control、theme_capacity_cost 设计新变体。Path 4 的晋级标准不能只看单一短窗 CAGR，必须同时记录 since_2020_01/since_2023_01 稳定性、最差回撤、换手与是否只是单票幸运。第一阶段不直接改写 official winner；若五窗口表现持续优于现有路径，再决定是否独立展示 Path 4 winner 或并入 tracked/top5 体系。\n\nA股 Path 5 事件知识图谱：作为新的 A股研究路径入口，每轮读取 docs/path5_event_knowledge_graph_plan.md、results/research/a_share/event_theme_registry.json 与 results/research/a_share/event_theme_candidates.jsonl；先维护最小事件篮子、冻结候选池、来源审计状态和 event_backtest_entry 需求，不把待审计 seed 当成有效策略结论。若 report.quotas.ashare_path5 或 path5_event_baskets 显示 registry/candidates 缺失，下一轮第一优先级是补齐入口；若 pending_audit_count > 0，优先做来源审计和候选冻结，审计通过后才设计最小事件篮子回测并与 Path 4 强主题涌现比较。\n\n沪港通研究线：每轮纳入且保持增量，不并入 A股 winner 结论，继续保留周频、双周、月频候选，并按 report.quotas.hkconnect 对 Path1-7 分配新增候选预算。HK Path4-7 使用 docs/hkconnect_strategy_expansion_plan.md 维护：Path4 多因子质量/流动性动量、Path5 回踩续涨/突破回踩、Path6 大市值高流动核心、Path7 杠铃组合；guard 的 hkconnect_path4_expansion 至 hkconnect_path7_expansion 若有缺口，按 rerun_commands 优先补齐。若 guard 给出 HK blocking rerun_commands，优先执行。新增或确认 HK 候选使用 .venv/bin/python backtest_hkconnect.py --sample-tags <WINDOWS> --only-strategy-ids <IDS>。同步当前 HK tracked/top5/live active 集合用 .venv/bin/python backtest_hkconnect.py --family-scope tracked_active --sample-tags since_2017_01,since_2020_01,since_2023_01,since_2025_01,since_2026_01。常规 6 小时迭代不要裸跑全量 HK，也不要跑 HK research_active/all，除非明确低频全量校验。\n\n同步与提交：A股结果变化、候选补跑、Path 2/3/4/5/HK 结果变化或多因子补齐后，至少运行 .venv/bin/python scripts/update_weighted_winners.py；HK comparison 变化时运行 .venv/bin/python scripts/update_hkconnect_artifacts.py。若出现新窗口赢家、robust candidate 变化或关键指标显著改善，更新 README、HISTORY.md、tracked winner 数据与对比图。无论 winner-change 还是 sync-only 提交，提交前都必须运行 .venv/bin/python scripts/export_live_platform_data.py 与 .venv/bin/python scripts/generate_public_snapshot.py；只有确认二者无必要变更时才可说明跳过。没有新 winner 但 tracked/robust/live/public/research 产物有有效同步修正，也允许提交 sync-only 更新。\n\n收尾自检与总结：提交前检查每条路径是否至少完成巡检、候选设计或新增实验信息；若某路径只有同步而无候选设计，优先补最小候选设计记录。最终总结按 A股 Path 1（含 core_multifactor 子段）、A股 Path 2、A股 Path 3、A股 Path 4 强主题涌现、A股 Path 5 事件知识图谱、沪港通 Path 1、沪港通 Path 2、沪港通 Path 3、HK Path 4、HK Path 5、HK Path 6、HK Path 7 分组，列出新增/复跑 strategy/base ids、命令类型、覆盖窗口、是否改变 window winner/robust candidate/tracked payload、evict/归档情况，以及未达预算或未回测的原因和下一轮第一条命令。"
