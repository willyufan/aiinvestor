prompt = "持续迭代 aiinvestor 的策略研究与结果产物。北极星：每轮都要在 A股与沪港通的每条研究路径上产生新的、可比较的、更可能胜出的策略信息，而不是只复跑老策略或同步产物。\n\n工作树安全：允许 main 有未提交改动；开始先看 git status/diff，识别并保留已有用户改动。不要因为 dirty main 停止任务；不要执行 git reset、git checkout、git clean 或任何会丢弃用户改动的操作；不要创建或切换独立 worktree。提交前只 stage 本轮自动任务产生或同步修正的目标文件，不带入无关用户改动；若同一处内容实质冲突且无法判断，才停止说明。\n\n每轮固定流程：\n1. 运行 .venv/bin/python scripts/research_iteration_guard.py，读取 research_iteration_report/state/experiments。\n2. 若 coverage_gate.status 为 block，优先执行 report.blocking scopes 给出的增量 rerun_commands，然后重跑 guard；不要把 --only-base-ids/--only-strategy-ids 补缺口命令替换成全量回测。\n3. 读取并更新各路径计划文档：docs/path1_plan.md、docs/path2_plan.md、docs/path3_plan.md、docs/path1_plan_hkconnect.md、docs/path2_plan_hkconnect.md、docs/path3_plan_hkconnect.md。\n4. 根据 report.quotas、report.rotation、recommended_focus 和最近失败记录，为每条路径设计并推进新增候选或新参数变体。\n5. 做必要的 winner/robust/tracked/live/public 同步，最后再次运行 research_iteration_guard.py，同步覆盖率、实验记录与停滞轮换状态。\n\n实验预算与判定：在 blocking coverage 补齐后，A股 Path 1、A股 Path 2、A股 Path 3、沪港通 Path 1、沪港通 Path 2、沪港通 Path 3 每轮都应至少推进一个微批量：每条路径至少设计 3 个具体候选/参数变体，并尽量运行至少 2 个可执行候选；如果缓存或时间不足，至少完成 1 个增量回测候选，并在总结里列出另外 2 个已设计但未运行的候选及下一轮命令。新增实验必须留下候选 id、相对现有 winner/robust candidate 的改动点、验证窗口、结果优劣、失败原因或晋级理由。coverage 补缺口、确认已有 winner_only_pass 候选、确认已有 candidate-pass 宇宙、tracked_active 同步、图表/public/live 导出都不算新增策略实验。\n\n多路径纪律：每轮必须推进 A股 Path 1、A股 Path 4-lite/core_multifactor、A股 Path 2、A股 Path 3 与沪港通 Path 1/2/3。winner_only_pass 只可作为 A股 Path 1 fast-pass；path2_candidate_pass、图表生成和 comparison rebuild 不是回测。即使某一路径发现 clear improvement，也不能取消其他路径的最小新增探索。若某路径没有新 winner，要根据失败结果扩大参数间距、换候选族、加/减风控 overlay、调整持仓/换手约束，或轮换到 recommended_focus。\n\nA股回测保持增量：补缺口或确认新增候选使用 .venv/bin/python backtest_marketcap_etf.py --sample-tags <WINDOWS> --only-base-ids <IDS>。常规 6 小时迭代不要跑 research_active、archive 或 all；只有明确低频全量校验才允许。同步当前活跃观察集合用 .venv/bin/python backtest_marketcap_etf.py --family-scope refresh_active --sample-tags since_2017_01,since_2020_01,since_2023_01,since_2025_01,since_2026_01。\n\nA股 Path 1：渐进优化路径，限制在 docs/path1_plan.md 的固定方向内；可用 scripts/winner_only_pass.py 快筛，围绕 promotion_ramp、satellite_defense、holding_shape、weekly_exposure_path 等方向维持约 24-28 个 fast-pass base candidates，并优先比较 weekly_exposure_path 中 __port_weekly_exposure_buffered 与 __port_weekly_exposure_asym。只有候选明确改善 Path 1 窗口赢家时才补必要确认回测。\n\nA股 Path 4-lite/core_multifactor：每轮读取 backtest_marketcap_etf.py 中 PATH1_FAST_PASS_DIRECTION_GROUPS[\"core_multifactor\"] 与 PATH1_FAST_PASS_VARIANT_IDS，确认 9 个多因子 base candidate 都在候选池且五个窗口覆盖完整；缺口只用 --only-base-ids 补。若 report.rotation/recommended_focus、多因子结果变化或 Path 1 停滞指向多因子，还要设计并尝试新的多因子组合、overlay 或确认形态。\n\nA股 Path 2：无约束上限探索，独立于 Path 1。读取 docs/path2_plan.md，运行 scripts/path2_candidate_pass.py，沿独立候选族推进；优先增加适配 since_2020_01 的中周期高收益原型，保持五个候选族不过度被单一 high_growth family 压扁；维护四窗口 winner 与 robust candidate，必要时运行 scripts/update_weighted_winners.py。\n\nA股 Path 3：纯周度高频调仓，独立于 Path 1/2。读取 docs/path3_plan.md；策略 id 应以 _weekly 结尾；不要把月度选股 + 周度仓位 overlay 混入 Path 3。重点比较 since_2020_01 与 since_2023_01 的可持续改善，同时记录高换手和高回撤代价。\n\n沪港通研究线：每轮纳入且保持增量，不并入 A股 winner 结论，继续保留周频、双周、月频候选。若 guard 给出 HK blocking rerun_commands，优先执行。新增或确认 HK 候选使用 .venv/bin/python backtest_hkconnect.py --sample-tags <WINDOWS> --only-strategy-ids <IDS>。同步当前 HK tracked/top5/live active 集合用 .venv/bin/python backtest_hkconnect.py --family-scope tracked_active --sample-tags since_2017_01,since_2020_01,since_2023_01,since_2025_01,since_2026_01。常规 6 小时迭代不要裸跑全量 HK，也不要跑 HK research_active/all，除非明确低频全量校验。\n\n同步与提交：A股结果变化、候选补跑、Path 2/3/HK 结果变化或多因子补齐后，至少运行 .venv/bin/python scripts/update_weighted_winners.py；HK comparison 变化时运行 .venv/bin/python scripts/update_hkconnect_artifacts.py。若出现新窗口赢家、robust candidate 变化或关键指标显著改善，更新 README、HISTORY.md、tracked winner 数据与对比图，并固定运行 .venv/bin/python scripts/export_live_platform_data.py 与 .venv/bin/python scripts/generate_public_snapshot.py。没有新 winner 但 tracked/robust/live/public/research 产物有有效同步修正，也允许提交 sync-only 更新。\n\n收尾自检与总结：提交前检查每条路径是否产生了新增候选设计或新增实验信息；若某路径只有巡检/同步，优先补一次最小候选尝试。最终总结必须按 A股 Path 1、A股 Path 4-lite/core_multifactor、A股 Path 2、A股 Path 3、沪港通 Path 1、沪港通 Path 2、沪港通 Path 3 分组，列出新增/复跑 strategy/base ids、命令类型、覆盖窗口、是否改变 window winner/robust candidate/tracked payload，以及未达实验预算的原因和下一轮第一条命令。"
