prompt = "Nightly cache refresh 的首要目标是：在收盘后刷新当天可用的股票市场数据，然后用刷新后的当天数据运行既定策略回测，并发布相应研究/展示产物。这个任务不是策略研究迭代：不要新增策略候选，不要调参探索，不要跑全量归档策略。\n\n工作树安全：任务运行在当前 main 工作树，即使开始时已有未提交改动也继续。开始先看 git status/diff 识别用户已有改动。不要执行 git reset、git checkout、git clean 或任何会丢弃用户改动的操作。若目标输出文件已有改动，保留已有内容并叠加本轮刷新；只有同一处内容实质冲突且无法安全合并时才停止。提交前只 stage 本任务产生的目标输出文件。\n\nTushare 网络执行方式：所有可能调用 Tushare 的步骤，手动执行时必须直接使用非沙盒/提升网络权限运行；不要先在普通 Codex 沙盒里试跑，因为已验证普通沙盒会对 api.waditu.com 产生 DNS 解析失败，而提升网络权限可直接成功。当前可行方式是：用提升网络权限执行原始 Tushare 命令本身。当前环境无需显式 unset 代理；但若运行前检测到 HTTP_PROXY、HTTPS_PROXY、ALL_PROXY、http_proxy、https_proxy 或 all_proxy 存在，应先 unset 后再用提升网络权限执行。不要把普通沙盒 DNS 失败当成 Tushare/API 故障反复重试。\n\n交易日目标：A股和沪港通分别按各自交易日历处理。每天 18:00 运行时，若当天是该市场交易日且收盘后数据应已可用，目标就是当天交易日；若当天不是交易日或数据窗口尚未到，则使用该市场最近一个已收盘开放交易日。两个市场独立判断；一个市场数据/API 阻塞时，不影响另一个市场继续刷新和回测。\n\n第一步必须刷新原始行情缓存。对每个市场，比较本地 raw cache 覆盖日期和目标交易日，按时间顺序补齐 latest covered date + 1 到 target_date 之间所有缺失开放交易日，而不是只尝试最后一天。A股需补 daily、daily_basic、adj_factor、index_daily；沪港通需补 daily_adj 以及 HK calendar/basic/connect-list 相关缓存。data_cache/ 是本地缓存，不要强行 stage 或提交。\n\n第二步用刷新后的数据跑策略回测。只有当该市场 raw cache 已覆盖到目标交易日，才用目标交易日作为 --end-date；如果部分数据缺失导致只能覆盖到更早日期，记录 blocker，不要把输出标成目标交易日。若业务上仍需基于最新有效缓存做同步，只能使用 latest valid cache date，并在总结里明确 target_date 与 actual_end_date 不一致。\n\nA股策略回测命令固定使用 active refresh 集合，并以非沙盒/提升网络权限运行：\n.venv/bin/python backtest_marketcap_etf.py --family-scope refresh_active --sample-tags since_2017_01,since_2020_01,since_2023_01,since_2025_01,since_2026_01 --end-date <A_SHARE_ACTUAL_END_DATE>\n不要使用 research_active、archive、all、core_active、winner-only，也不要裸跑 A股回测命令。\n\n沪港通策略回测命令固定使用 tracked/top5/live active 集合，并以非沙盒/提升网络权限运行：\n.venv/bin/python backtest_hkconnect.py --family-scope tracked_active --sample-tags since_2017_01,since_2020_01,since_2023_01,since_2025_01,since_2026_01 --end-date <HK_ACTUAL_END_DATE>\n如需单独预热 HK 缓存，可先用同一 end date 加 --warm-cache-only，并同样以非沙盒/提升网络权限运行，然后继续 tracked_active 回测。不要裸跑 backtest_hkconnect.py，不要跑 research_active/all，也不要跑全量 HK Path 1/2/3 variants。\n\n重试规则：脚本内部已有 Tushare 重试。若手动运行中出现 DNS/network/connection error，先确认该命令是否已经使用非沙盒/提升网络权限；如果没有，直接用提升网络权限重跑同一市场步骤，不做普通沙盒重试。只有在已使用提升网络权限后仍出现临时网络或上游 API 错误，才对失败市场步骤最多额外重试 3 次，每次间隔 30 秒。复用已完成的缓存进度，不重复执行已成功的市场阶段。权限、配置、token、接口额度等持续性错误视为 blocker，不要无限重试。\n\n回测成功后的同步：任一市场完成当天数据刷新和策略回测后，运行：\n.venv/bin/python scripts/update_weighted_winners.py\n.venv/bin/python scripts/export_live_platform_data.py\n.venv/bin/python scripts/generate_public_snapshot.py\n若 HK comparison 有变化，也运行 .venv/bin/python scripts/update_hkconnect_artifacts.py。导出产物必须保留两个日期概念：市场数据截止日来自 raw cache/backtest actual_end_date；调仓/信号生效日来自策略真实的月频、周频或双周评估点。\n\n提交与推送：提交前检查最终 diff。只 stage 可发布的轻量结果，例如 README.md、HISTORY.md、docs/*.png、results/research/a_share/*.json、results/research/a_share/*.jsonl、results/research/a_share/*.csv、results/research/a_share/strategies/*.json、results/research/hkconnect/*.json、results/research/hkconnect/*.csv。不要 stage data_cache/、results/backtests/、被忽略的 results/live/ 文件、config.py、无关源码、无关文档或用户已有改动。若当天数据刷新导致 tracked winner、robust candidate、策略指标、README/HISTORY/charts/research/public snapshot 有有效变化，提交并 push；若只有无关 diff，勿提交。\n\n最终总结按市场分别报告：target_date、actual_end_date、缺失交易日、原始行情缓存是否补到当天、策略回测是否运行到当天、Tushare 命令是否使用非沙盒/提升网络权限、是否检测到并处理代理变量、winner/robust/tracked 是否变化、live/public 是否重新生成、重试次数、blocker、提交文件以及是否 commit/push。"
